name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (self-contained, single file)
        run: dotnet publish Jembatan.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o publish

      - name: Fetch Tesseract OCR (pinned, hash-verified)
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\tess-setup.exe"
          Invoke-WebRequest -Uri "https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe" -OutFile $setup
          $h = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9") { throw "hash installer tesseract tidak cocok: $h" }
          $dest = "$env:RUNNER_TEMP\tess-inst"
          Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dest" -Wait
          New-Item -ItemType Directory -Force -Path "publish\tesseract\tessdata" | Out-Null
          Copy-Item "$dest\tesseract.exe" "publish\tesseract\"
          Copy-Item "$dest\*.dll" "publish\tesseract\" -ErrorAction SilentlyContinue
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/eng.traineddata" -OutFile "publish\tesseract\tessdata\eng.traineddata"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/ind.traineddata" -OutFile "publish\tesseract\tessdata\ind.traineddata"
          $he = (Get-FileHash "publish\tesseract\tessdata\eng.traineddata" -Algorithm SHA256).Hash.ToLower()
          $hi = (Get-FileHash "publish\tesseract\tessdata\ind.traineddata" -Algorithm SHA256).Hash.ToLower()
          if ($he -ne "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2") { throw "hash eng.traineddata tidak cocok" }
          if ($hi -ne "69786901da87ab8766c1ea7fbb10b28f2110c14da3f6c8f2735df131fba95d88") { throw "hash ind.traineddata tidak cocok" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\jembatan.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: jembatan-setup
          path: installer\Output\Jembatan-Setup.exe
